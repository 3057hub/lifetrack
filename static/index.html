<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D9488">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<title>LifeTrack</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: '#0D9488', light: '#14B8A6', dark: '#0F766E', pale: '#CCFBF1' },
          accent: { DEFAULT: '#F97316', hover: '#EA580C' },
        }
      }
    }
  }
</script>
<style>
  [x-cloak] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
    padding-bottom: calc(64px + var(--safe-bottom));
  }
  input, textarea, select { font-size: 16px; }

  /* Timer */
  .timer-display { font-size: 56px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .timer-ring { animation: timer-pulse 2s ease-in-out infinite; }
  @keyframes timer-pulse { 0%, 100% { opacity: 0.15; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.05); } }

  /* Toast container */
  .toast-container { position: fixed; top: 16px; right: 16px; left: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast-item { pointer-events: auto; max-width: 320px; }

  /* Markdown / report body */
  .report-body h1, .report-body h2, .report-body h3 { margin: 0 0 4px; }
  .report-body h1 { font-size: 1.1em; }
  .report-body h2, .report-body h3 { font-size: 1em; }
  .report-body p { margin-bottom: 8px; line-height: 1.6; }
  .report-body ul, .report-body ol { padding-left: 20px; margin-bottom: 8px; }
  .report-body li { margin-bottom: 4px; line-height: 1.5; }
  .report-body code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
  .dark .report-body code { background: #374151; }

  /* Spinner */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Transition overrides for x-transition */
  .modal-enter { transition: opacity .2s ease-out, transform .2s ease-out; }
  .modal-leave { transition: opacity .15s ease-in, transform .15s ease-in; }
</style>
</head>
<body x-data="app()" x-cloak x-init="initDarkMode()" class="min-h-screen bg-slate-50 text-slate-800 dark:bg-gray-900 dark:text-gray-100 transition-colors">

<!-- Toast Container -->
<div class="toast-container">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast-item rounded-lg px-4 py-3 text-sm text-white shadow-lg flex items-center gap-2"
      :class="t.type === 'error' ? 'bg-red-500' : t.type === 'success' ? 'bg-emerald-500' : 'bg-slate-700 dark:bg-slate-600'"
      x-show="t.show"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-x-8"
      x-transition:enter-end="opacity-100 translate-x-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-x-0"
      x-transition:leave-end="opacity-0 translate-x-8">
      <svg x-show="t.type === 'error'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><line x1="15" y1="9" x2="9" y2="15" stroke-width="2"/><line x1="9" y1="9" x2="15" y2="15" stroke-width="2"/></svg>
      <svg x-show="t.type === 'success'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><polyline points="9,12 11,14 15,10" stroke-width="2"/></svg>
      <span x-text="t.msg"></span>
    </div>
  </template>
</div>

<!-- Password Gate -->
<template x-if="!authed">
<div class="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-50 dark:bg-gray-900">
  <div class="w-full max-w-sm text-center">
    <div class="text-5xl mb-3">⏱️</div>
    <h1 class="text-2xl font-bold mb-2 text-primary dark:text-primary-light">LifeTrack</h1>
    <p class="text-slate-500 dark:text-gray-400 mb-6 text-sm">登录你的账号</p>
    <input type="text" x-model="loginUser" @keydown.enter="doAuth()" placeholder="用户名"
      class="w-full px-4 py-3 border-2 border-slate-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-800 dark:text-white focus:border-primary focus:outline-none transition-colors mb-3" autocomplete="username">
    <input type="password" x-model="pwdInput" @keydown.enter="doAuth()" placeholder="密码"
      class="w-full px-4 py-3 border-2 border-slate-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-800 dark:text-white focus:border-primary focus:outline-none transition-colors" autocomplete="current-password">
    <button class="w-full mt-4 py-3 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="doAuth()">进入</button>
    <p class="mt-3 text-sm text-red-500" x-show="authError" x-text="authError"></p>
  </div>
</div>
</template>

<!-- App -->
<template x-if="authed">
<div class="max-w-lg mx-auto">

  <!-- Record View -->
  <div x-show="view === 'record'"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-x-4"
    x-transition:enter-end="opacity-100 translate-x-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-x-0"
    x-transition:leave-end="opacity-0 translate-x-4">
    <!-- Timer Card -->
    <div class="mx-4 mt-4 p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm text-center">
      <div class="relative inline-flex items-center justify-center my-2">
        <div x-show="activeTimer" class="absolute inset-0 rounded-full border-4 border-primary/20 timer-ring"></div>
        <div class="timer-display relative z-10 px-4"
          :class="activeTimer ? 'text-primary dark:text-primary-light' : 'text-slate-300 dark:text-gray-600'"
          x-text="timerDisplay"></div>
      </div>
      <template x-if="!activeTimer">
        <button class="w-full py-5 rounded-2xl font-bold text-xl text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="startTimer()">开 始</button>
      </template>
      <template x-if="activeTimer">
        <button class="w-full py-5 rounded-2xl font-bold text-xl text-white bg-[#F97316] hover:bg-[#EA580C] active:opacity-70 transition-all" @click="stopTimer()">结 束</button>
      </template>
      <p class="text-xs text-slate-400 dark:text-gray-500 mt-3" x-text="activeTimer ? '计时进行中...' : '点击开始记录当前活动'"></p>
    </div>

    <!-- Manual Entry -->
    <div class="mx-4 mt-3 p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm">
      <h3 class="font-semibold text-sm text-slate-500 dark:text-gray-400 mb-3">手动补录</h3>
      <div class="space-y-3">
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">开始时间</label><input type="datetime-local" x-model="form.start_time" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">结束时间</label><input type="datetime-local" x-model="form.end_time" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">描述</label><input type="text" x-model="form.description" placeholder="做了什么..." class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">标签（逗号分隔）</label><input type="text" x-model="form.tags" placeholder="工作,学习,运动" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
      </div>
      <button class="w-full mt-4 py-2.5 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="submitManual()">添加记录</button>
    </div>
  </div>

  <!-- History View -->
  <div x-show="view === 'history'"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-x-4"
    x-transition:enter-end="opacity-100 translate-x-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-x-0"
    x-transition:leave-end="opacity-0 -translate-x-4">
    <div class="mx-4 mt-4 p-3 bg-white dark:bg-gray-800 rounded-2xl shadow-sm flex gap-2 items-center">
      <input type="date" x-model="historyDate" @change="loadHistory()" class="flex-1 p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors">
      <button class="px-4 py-2.5 text-sm font-medium text-slate-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary-light transition-colors" @click="historyDate='';loadHistory()">全部</button>
    </div>
    <!-- Loading skeleton -->
    <template x-if="loading.history">
      <div class="mx-4 mt-3 space-y-3 animate-pulse">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4"><div class="h-3 bg-slate-200 dark:bg-gray-700 rounded w-20 mb-3"></div><div class="h-4 bg-slate-200 dark:bg-gray-700 rounded w-48"></div></div>
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4"><div class="h-3 bg-slate-200 dark:bg-gray-700 rounded w-16 mb-3"></div><div class="h-4 bg-slate-200 dark:bg-gray-700 rounded w-36"></div></div>
      </div>
    </template>
    <template x-if="!loading.history && Object.keys(historyGroups).length === 0">
      <div class="text-center py-16 text-slate-400 dark:text-gray-500">
        <svg class="w-20 h-20 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-sm">还没有记录</p>
        <p class="text-xs mt-1">点击底部"记录"开始追踪时间</p>
      </div>
    </template>
    <template x-for="(items, day) in historyGroups">
      <div class="mx-4 mt-3">
        <div class="text-xs font-bold text-slate-400 dark:text-gray-500 px-1 py-2 flex items-center gap-2">
          <span x-text="day"></span>
          <span class="font-normal text-[11px] text-slate-300 dark:text-gray-600" x-text="'· ' + dayTotal(items)"></span>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
          <template x-for="(item, idx) in items">
            <div class="flex items-start gap-3 px-4 py-3" :class="idx < items.length - 1 ? 'border-b border-slate-50 dark:border-gray-700/50' : ''">
              <div class="text-xs text-slate-400 dark:text-gray-500 whitespace-nowrap min-w-[90px] pt-0.5">
                <div x-text="fmtTime(item.start_time)"></div>
                <div class="flex items-center gap-1">
                  <span x-text="item.end_time ? '→ ' + fmtTime(item.end_time) : '进行中'"></span>
                  <span class="text-[10px] text-slate-300 dark:text-gray-600" x-show="item.end_time" x-text="fmtDuration(item.start_time, item.end_time)"></span>
                </div>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-sm" x-text="item.description || '(无描述)'"></div>
                <div class="flex gap-1 flex-wrap mt-1.5">
                  <template x-for="t in (item.tags||'').split(',').filter(Boolean)">
                    <span class="text-[10px] bg-primary-pale text-primary-dark dark:bg-teal-900/40 dark:text-teal-300 px-2 py-0.5 rounded-full font-medium" x-text="t.trim()"></span>
                  </template>
                </div>
              </div>
              <div class="flex gap-1 shrink-0">
                <button class="p-2 text-slate-300 dark:text-gray-600 hover:text-primary dark:hover:text-primary-light transition-colors" @click="editItem(item)" aria-label="编辑">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button class="p-2 text-slate-300 dark:text-gray-600 hover:text-red-500 transition-colors" @click="deleteItem(item.id)" aria-label="删除">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Report View -->
  <div x-show="view === 'report'"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-x-4"
    x-transition:enter-end="opacity-100 translate-x-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-x-0"
    x-transition:leave-end="opacity-0 translate-x-4">
    <div class="mx-4 mt-4 flex gap-2">
      <button class="flex-1 py-3 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all disabled:opacity-50 flex items-center justify-center gap-2" @click="generateReport('day')" :disabled="generating !== ''">
        <span class="spinner" x-show="generating === 'day'"></span>今日总结
      </button>
      <button class="flex-1 py-3 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all disabled:opacity-50 flex items-center justify-center gap-2" @click="generateReport('week')" :disabled="generating !== ''">
        <span class="spinner" x-show="generating === 'week'"></span>本周分析
      </button>
    </div>

    <!-- Loading skeleton -->
    <template x-if="generating !== ''">
      <div class="mx-4 mt-3 space-y-3 animate-pulse">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4"><div class="h-4 bg-slate-200 dark:bg-gray-700 rounded w-24 mb-3"></div><div class="h-3 bg-slate-200 dark:bg-gray-700 rounded w-full mb-2"></div><div class="h-3 bg-slate-200 dark:bg-gray-700 rounded w-3/4"></div></div>
      </div>
    </template>

    <template x-if="latestReport && !generating">
    <div>
      <template x-for="section in reportSections">
        <div class="mx-4 mt-3 bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
          <div class="px-4 py-3 font-semibold text-sm text-primary dark:text-primary-light border-b-2 border-primary-pale dark:border-teal-900/30" x-text="section.title"></div>
          <div class="px-4 py-3 report-body text-sm text-slate-700 dark:text-gray-300" x-html="section.html"></div>
        </div>
      </template>

      <div class="mx-4 mt-3 bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4" x-show="latestReport.user_feedback">
        <p class="text-xs text-slate-400 dark:text-gray-500">你的反馈：<strong class="text-slate-700 dark:text-gray-300" x-text="feedbackLabel(latestReport.user_feedback)"></strong></p>
      </div>
      <div class="mx-4 mt-3 bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4" x-show="!latestReport.user_feedback">
        <p class="text-xs text-slate-400 dark:text-gray-500 mb-3">这个建议对你有帮助吗？</p>
        <div class="flex gap-2">
          <button class="flex-1 py-2 rounded-lg text-sm font-medium transition-all"
            :class="feedbackSent === 'helpful' ? 'bg-emerald-500 text-white' : 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900/40'"
            @click="sendFeedback('helpful')">有帮助</button>
          <button class="flex-1 py-2 rounded-lg text-sm font-medium transition-all"
            :class="feedbackSent === 'executed' ? 'bg-primary text-white' : 'bg-primary-pale dark:bg-teal-900/20 text-primary dark:text-primary-light hover:bg-teal-100 dark:hover:bg-teal-900/40'"
            @click="sendFeedback('executed')">已执行</button>
          <button class="flex-1 py-2 rounded-lg text-sm font-medium transition-all"
            :class="feedbackSent === 'ignored' ? 'bg-slate-400 text-white' : 'bg-slate-100 dark:bg-gray-700 text-slate-500 dark:text-gray-400 hover:bg-slate-200 dark:hover:bg-gray-600'"
            @click="sendFeedback('ignored')">忽略</button>
        </div>
      </div>
    </div>
    </template>

    <!-- Report history list -->
    <template x-if="reportList.length > 0">
      <div class="mx-4 mt-4">
        <button class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-gray-400 mb-2 px-1"
          @click="showReportHistory = !showReportHistory">
          <svg class="w-3 h-3 transition-transform" :class="showReportHistory ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6" stroke-width="2"/></svg>
          历史报告 (<span x-text="reportList.length"></span>)
        </button>
        <div x-show="showReportHistory" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
          <template x-for="r in reportList">
            <div class="flex items-center gap-3 px-4 py-2.5 border-b border-slate-50 dark:border-gray-700/50 last:border-0 cursor-pointer hover:bg-slate-50 dark:hover:bg-gray-700/50 transition-colors"
              :class="{ 'bg-primary-pale dark:bg-teal-900/20': latestReport && latestReport.id === r.id }"
              @click="viewReport(r)">
              <span class="text-xs text-slate-400 dark:text-gray-500 whitespace-nowrap" x-text="new Date(r.created_at).toLocaleDateString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})"></span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-medium"
                :class="fmtPeriod(r) === '日' ? 'bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-purple-50 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400'"
                x-text="fmtPeriod(r) === '日' ? '日' : '周'"></span>
              <span x-show="r.user_feedback" class="text-[10px] text-slate-400 dark:text-gray-500" x-text="feedbackLabel(r.user_feedback)"></span>
              <button class="ml-auto p-1 text-slate-300 dark:text-gray-600 hover:text-red-500 transition-colors" @click.stop="deleteReport(r.id)" aria-label="删除">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke-width="2"/></svg>
              </button>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!latestReport && !generating">
      <div class="text-center py-16 text-slate-400 dark:text-gray-500">
        <svg class="w-20 h-20 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <p class="text-sm">点击上方按钮生成 AI 分析报告</p>
      </div>
    </template>
  </div>

  <!-- Goals View -->
  <div x-show="view === 'goals'"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-x-4"
    x-transition:enter-end="opacity-100 translate-x-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-x-0"
    x-transition:leave-end="opacity-0 -translate-x-4">
    <div class="mx-4 mt-4 p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm">
      <h3 class="font-semibold text-sm text-slate-500 dark:text-gray-400 mb-3">当前目标</h3>
      <template x-if="activeGoals.length === 0">
        <p class="text-sm text-slate-400 dark:text-gray-500 py-2">还没有设定目标</p>
      </template>
      <template x-for="g in activeGoals">
        <div class="flex items-center gap-3 py-3 border-b border-slate-50 dark:border-gray-700/50 last:border-0">
          <span class="flex-1 text-sm" x-text="g.content"></span>
          <button class="px-3 py-1.5 text-xs font-medium text-slate-400 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors" @click="deactivateGoal(g.id)">停用</button>
        </div>
      </template>
    </div>

    <div class="mx-4 mt-3 p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm">
      <h3 class="font-semibold text-sm text-slate-500 dark:text-gray-400 mb-3">添加新目标</h3>
      <div class="flex gap-2">
        <input type="text" x-model="newGoal" @keydown.enter="addGoal()" placeholder="例如：每天深度工作3小时" class="flex-1 p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors">
        <button class="px-5 py-2.5 rounded-lg font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="addGoal()">添加</button>
      </div>
    </div>

    <div class="mx-4 mt-3 p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm" x-show="inactiveGoals.length > 0">
      <h3 class="font-semibold text-sm text-slate-400 dark:text-gray-500 mb-3">已停用的目标</h3>
      <template x-for="g in inactiveGoals">
        <div class="flex items-center gap-3 py-3 border-b border-slate-50 dark:border-gray-700/50 last:border-0">

  <!-- Bottom Nav -->
  <div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-slate-200 dark:border-gray-700 flex justify-around z-50" style="padding-bottom:var(--safe-bottom)">
    <button class="flex flex-col items-center gap-1 py-2 px-3 min-w-[44px] min-h-[44px] justify-center bg-transparent border-0 text-slate-400 dark:text-gray-500 transition-colors" :class="{ '!text-primary dark:!text-primary-light': view === 'record' }" @click="goView('record')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><polyline points="12,7 12,12 15,15" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="text-[10px]">记录</span>

    <button class="flex flex-col items-center gap-1 py-2 px-3 min-w-[44px] min-h-[44px] justify-center bg-transparent border-0 text-slate-400 dark:text-gray-500 transition-colors" :class="{ '!text-primary dark:!text-primary-light': view === 'history' }" @click="goView('history')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/></svg>

      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[10px]">报告</span>
    </button>
    <button class="flex flex-col items-center gap-1 py-2 px-3 min-w-[44px] min-h-[44px] justify-center bg-transparent border-0 text-slate-400 dark:text-gray-500 transition-colors" :class="{ '!text-primary dark:!text-primary-light': view === 'goals' }" @click="goView('goals')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
      <span class="text-[10px]">目标</span>
    </button>
  </div>

  <!-- Dark mode toggle -->
  <button class="fixed top-3 right-3 z-50 p-2 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-sm text-slate-400 dark:text-gray-500 hover:text-primary dark:hover:text-primary-light transition-colors" @click="toggleDark()" aria-label="切换暗色模式">
    <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" stroke-width="2"/><line x1="12" y1="1" x2="12" y2="3" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-width="2"/></svg>
    <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>

  <!-- Edit Modal -->
  <div class="fixed inset-0 z-[200] flex items-end justify-center" x-show="editModal.show" @click.self="editModal.show=false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-lg bg-white dark:bg-gray-800 rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-xl"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full">
      <div class="w-10 h-1 bg-slate-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <h3 class="font-bold text-lg mb-4">编辑记录</h3>
      <div class="space-y-3">
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">开始</label><input type="datetime-local" x-model="editModal.start" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">结束</label><input type="datetime-local" x-model="editModal.end" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">描述</label><input type="text" x-model="editModal.desc" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">标签</label><input type="text" x-model="editModal.tags" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
      </div>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 py-2.5 rounded-xl font-semibold text-slate-500 dark:text-gray-400 bg-slate-100 dark:bg-gray-700 hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors" @click="editModal.show=false">取消</button>
        <button class="flex-1 py-2.5 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- Stop Timer Modal -->
  <div class="fixed inset-0 z-[200] flex items-end justify-center" x-show="stopModal.show" @click.self="stopModal.show=false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-lg bg-white dark:bg-gray-800 rounded-t-2xl p-6 max-h-[85vh] overflow-y-auto shadow-xl"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full">
      <div class="w-10 h-1 bg-slate-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <h3 class="font-bold text-lg mb-4">你在做什么？</h3>
      <div class="space-y-3">
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">描述</label><input type="text" x-model="stopModal.desc" @keydown.enter="confirmStop()" placeholder="输入活动描述..." class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
        <div><label class="block text-xs text-slate-400 dark:text-gray-500 mb-1">标签（逗号分隔）</label><input type="text" x-model="stopModal.tags" class="w-full p-2.5 border-2 border-slate-200 dark:border-gray-600 rounded-lg bg-slate-50 dark:bg-gray-700 dark:text-white focus:border-primary focus:outline-none transition-colors"></div>
      </div>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 py-2.5 rounded-xl font-semibold text-slate-500 dark:text-gray-400 bg-slate-100 dark:bg-gray-700 hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors" @click="stopModal.show=false">取消</button>
        <button class="flex-1 py-2.5 rounded-xl font-semibold text-white bg-primary hover:bg-primary-dark active:opacity-70 transition-all" @click="confirmStop()">确认结束</button>
      </div>
    </div>
  </div>

</div>
</template>

<script>
function app() {
  return {
    view: "record",
    authed: false,
    loginUser: "",
    pwdInput: "",
    token: "",
    authError: "",
    darkMode: false,
    toasts: [],
    loading: { history: false, goals: false, reports: false },
    // timer
    activeTimer: null,
    timerDisplay: "00:00:00",
    timerInterval: null,
    // forms
    form: { start_time: "", end_time: "", description: "", tags: "" },
    stopModal: { show: false, desc: "", tags: "" },
    // history
    historyDate: "",
    historyGroups: {},
    // edit
    editModal: { show: false, id: null, start: "", end: "", desc: "", tags: "" },
    // report
    latestReport: null,
    reportSections: [],
    reportList: [],
    showReportHistory: true,
    generating: "",
    feedbackSent: null,
    // goals
    goals: [],
    newGoal: "",

    get activeGoals() { return this.goals.filter(g => g.is_active); },
    get inactiveGoals() { return this.goals.filter(g => !g.is_active); },

    goView(v) {
      if (this.view === v) return;
      this.view = v;
      if (v === 'history') this.loadHistory();
      else if (v === 'report') { this.loadReport(); this.loadReportList(); }
      else if (v === 'goals') this.loadGoals();
    },

    // ── dark mode ──
    initDarkMode() {
      const stored = localStorage.getItem("lifetrack_dark");
      if (stored !== null) {
        this.darkMode = stored === "true";
      } else {
        this.darkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
      this.applyDarkMode();
    },
    toggleDark() {
      this.darkMode = !this.darkMode;
      localStorage.setItem("lifetrack_dark", this.darkMode);
      this.applyDarkMode();
    },
    applyDarkMode() {
      document.documentElement.classList.toggle("dark", this.darkMode);
    },

    async init() {
      const saved = localStorage.getItem("lifetrack_token");
      if (saved) {
        const parts = saved.split(":");
        if (parts.length === 2) {
          this.loginUser = parts[0];
          this.token = parts[1];
          this.authed = true;
          await this.checkActiveTimer();
        }
      }
    },

    api(path, opts = {}) {
      const headers = {};
      if (opts.method && opts.method !== "GET") headers["Content-Type"] = "application/json";
      if (this.authed && this.token) headers["Authorization"] = "Bearer " + this.token;
      else if (this.authed && this.pwdInput) headers["X-App-Password"] = this.pwdInput;
      return fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
    },

    showToast(msg, type = 'info') {
      const id = Date.now();
      const toast = { id, msg, type, show: true };
      this.toasts.push(toast);
      setTimeout(() => {
        const t = this.toasts.find(t => t.id === id);
        if (t) t.show = false;
        setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 300);
      }, 2500);
    },

    async doAuth() {
      if (!this.loginUser || !this.pwdInput) { this.authError = "请输入用户名和密码"; return; }
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: this.loginUser, password: this.pwdInput }),
        });
        const data = await res.json();
        if (data.token) {
          this.authed = true; this.authError = ""; this.token = data.token;
          localStorage.setItem("lifetrack_token", this.loginUser + ":" + this.token);
          await this.checkActiveTimer();
        } else { this.authError = data.detail || "登录失败"; }
      } catch { this.authError = "连接服务器失败"; }
    },

    // ── timer ──
    async checkActiveTimer() {
      try {
        const res = await this.api("/api/activities/active");
        const data = await res.json();
        if (data.active) { this.activeTimer = data.active; this.startTicking(data.active.start_time); }
      } catch (e) { console.error("checkActiveTimer:", e); }
    },

    startTicking(startIso) {
      const normalized = (startIso.endsWith("Z") || startIso.includes("+")) ? startIso : startIso + "Z";
      const start = new Date(normalized);
      if (isNaN(start.getTime())) { console.error("Invalid date:", startIso); return; }
      if (this.timerInterval) clearInterval(this.timerInterval);
      const tick = () => {
        const diff = Math.max(0, Date.now() - start.getTime());
        const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
        this.timerDisplay = [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
      };
      tick(); // 立即刷新一次
      this.timerInterval = setInterval(tick, 200);
    },

    async startTimer() {
      try {
        const res = await this.api("/api/activities", {
          method: "POST", body: JSON.stringify({ start_time: new Date().toISOString(), description: "" }),
        });
        const data = await res.json();
        this.activeTimer = data; this.startTicking(data.start_time); this.showToast("计时开始");
      } catch (e) { this.showToast("开始失败", "error"); }
    },

    stopTimer() {
      this.stopModal.desc = ""; this.stopModal.tags = ""; this.stopModal.show = true;
    },

    async confirmStop() {
      if (!this.activeTimer) return;
      try {
        await this.api("/api/activities/" + this.activeTimer.id, {
          method: "PUT", body: JSON.stringify({ end_time: new Date().toISOString(), description: this.stopModal.desc, tags: this.stopModal.tags }),
        });
        clearInterval(this.timerInterval);
        this.activeTimer = null; this.timerDisplay = "00:00:00"; this.stopModal.show = false;
        this.showToast("记录已保存");
      } catch (e) { this.showToast("保存失败", "error"); }
    },

    // ── manual entry ──
    async submitManual() {
      if (!this.form.start_time || !this.form.end_time) { this.showToast("请填写开始和结束时间"); return; }
      try {
        await this.api("/api/activities", {
          method: "POST", body: JSON.stringify({
            start_time: new Date(this.form.start_time).toISOString(), end_time: new Date(this.form.end_time).toISOString(),
            description: this.form.description, tags: this.form.tags,
          }),
        });
        this.form = { start_time: "", end_time: "", description: "", tags: "" };
        this.showToast("记录已添加");
      } catch (e) { this.showToast("添加失败"); }
    },

    // ── history ──
    async loadHistory() {
      this.loading.history = true;
      let url = "/api/activities?limit=200";
      if (this.historyDate) url += "&date_param=" + this.historyDate;
      try {
        const res = await this.api(url);
        const data = await res.json();
        this.historyGroups = {};
        for (const item of data) {
          const day = new Date(item.start_time).toLocaleDateString("zh-CN", { weekday: "long", month: "long", day: "numeric" });
          if (!this.historyGroups[day]) this.historyGroups[day] = [];
          this.historyGroups[day].push(item);
        }
      } catch (e) { console.error("loadHistory:", e); this.showToast("加载历史失败", "error"); }
      finally { this.loading.history = false; }
    },

    fmtTime(iso) { return new Date(iso).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }); },

    fmtDuration(startIso, endIso) {
      if (!endIso) return "进行中";
      const min = Math.round((new Date(endIso) - new Date(startIso)) / 60000);
      if (min < 60) return min + "m";
      const h = Math.floor(min / 60), m = min % 60;
      return m > 0 ? h + "h" + m + "m" : h + "h";
    },

    dayTotal(items) {
      let min = 0;
      for (const it of items) {
        if (it.end_time) min += (new Date(it.end_time) - new Date(it.start_time)) / 60000;
      }
      if (min < 60) return Math.round(min) + "m";
      const h = Math.floor(min / 60), m = Math.round(min % 60);
      return m > 0 ? h + "h" + m + "m" : h + "h";
    },

    editItem(item) {
      const toLocal = (iso) => {
        const d = new Date(iso);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
      };
      this.editModal = { show: true, id: item.id, start: toLocal(item.start_time), end: item.end_time ? toLocal(item.end_time) : "", desc: item.description || "", tags: item.tags || "" };
    },

    async saveEdit() {
      try {
        await this.api("/api/activities/" + this.editModal.id, {
          method: "PUT", body: JSON.stringify({
            start_time: this.editModal.start ? new Date(this.editModal.start).toISOString() : undefined,
            end_time: this.editModal.end ? new Date(this.editModal.end).toISOString() : undefined,
            description: this.editModal.desc, tags: this.editModal.tags,
          }),
        });
        this.editModal.show = false; await this.loadHistory(); this.showToast("已更新");
      } catch (e) { this.showToast("更新失败"); }
    },

    async deleteItem(id) {
      if (!confirm("确定删除这条记录？")) return;
      try { await this.api("/api/activities/" + id, { method: "DELETE" }); await this.loadHistory(); this.showToast("已删除"); }
      catch (e) { console.error("deleteItem:", e); this.showToast("删除失败", "error"); }
    },

    // ── goals ──
    async loadGoals() {
      try { const res = await this.api("/api/goals"); this.goals = await res.json(); }
      catch (e) { console.error("loadGoals:", e); this.showToast("加载目标失败", "error"); }
    },

    async addGoal() {
      if (!this.newGoal.trim()) return;
      try {
        await this.api("/api/goals", { method: "POST", body: JSON.stringify({ content: this.newGoal.trim() }) });
        this.newGoal = ""; await this.loadGoals(); this.showToast("目标已添加");
      } catch (e) { this.showToast("添加失败"); }
    },

    async deactivateGoal(id) {
      try { await this.api("/api/goals/" + id + "/deactivate", { method: "PUT" }); await this.loadGoals(); this.showToast("已停用"); }
      catch (e) { this.showToast("操作失败"); }
    },

    async activateGoal(id) {
      try { await this.api("/api/goals/" + id + "/activate", { method: "PUT" }); await this.loadGoals(); this.showToast("已启用"); }
      catch (e) { this.showToast("操作失败"); }
    },

    // ── reports ──
    parseSections(md) {
      if (!md) return [];
      const sections = [];
      const parts = md.split(/(?=^#{1,3}\s)/m);
      for (const part of parts) {
        const lines = part.trim().split("\n");
        const title = lines[0].replace(/^#{1,3}\s/, "").trim();
        const body = lines.slice(1).join("\n").trim();
        if (title) {
          sections.push({
            title: title,
            html: typeof marked !== "undefined" ? marked.parse(body || "") : (body || ""),
          });
        }
      }
      return sections;
    },

    feedbackLabel(fb) {
      const map = { helpful: "有帮助", executed: "已执行", ignored: "忽略" };
      return map[fb] || fb;
    },

    async loadReport() {
      try {
        const res = await this.api("/api/reports/latest");
        const data = await res.json();
        if (data.report) {
          this.latestReport = data.report;
          this.reportSections = this.parseSections(data.report.summary_text);
          this.feedbackSent = data.report.user_feedback || null;
        }
      } catch (e) { console.error("loadReport:", e); }
    },

    async loadReportList() {
      this.loading.reports = true;
      try {
        const res = await this.api("/api/reports?limit=20");
        this.reportList = await res.json();
      } catch (e) { console.error("loadReportList:", e); }
      finally { this.loading.reports = false; }
    },

    viewReport(r) {
      this.latestReport = r;
      this.reportSections = this.parseSections(r.summary_text);
      this.feedbackSent = r.user_feedback || null;
    },

    fmtPeriod(r) {
      const diff = new Date(r.period_end) - new Date(r.period_start);
      return diff < 36 * 3600000 ? '日' : '周';
    },

    async deleteReport(id) {
      if (!confirm("确定删除这份报告？")) return;
      try {
        await this.api("/api/reports/" + id, { method: "DELETE" });
        this.reportList = this.reportList.filter(r => r.id !== id);
        if (this.latestReport && this.latestReport.id === id) {
          this.latestReport = null;
          this.reportSections = [];
        }
        this.showToast("已删除");
      } catch (e) { this.showToast("删除失败", "error"); }
    },

    async generateReport(period) {
      this.generating = period;
      try {
        const res = await this.api("/api/reports/generate", {
          method: "POST", body: JSON.stringify({ period }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "生成失败");
        }
        this.latestReport = await res.json();
        this.reportSections = this.parseSections(this.latestReport.summary_text);
        this.feedbackSent = null;
        this.loadReportList();
        this.showToast("报告已生成");
      } catch (e) { this.showToast(e.message || "生成失败，请检查 API Key 配置", "error"); }
      finally { this.generating = ""; }
    },

    async sendFeedback(feedback) {
      if (!this.latestReport) return;
      try {
        await this.api("/api/reports/" + this.latestReport.id + "/feedback", {
          method: "PUT", body: JSON.stringify({ feedback }),
        });
        this.latestReport.user_feedback = feedback;
        this.feedbackSent = feedback;
        this.showToast("感谢反馈");
      } catch (e) { this.showToast("反馈提交失败"); }
    },
  };
}

// pwa
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
</script>
