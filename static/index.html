<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="/manifest.json">
<title>LifeTrack</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f1f5f9; --card: #fff; --text: #1e293b; --sub: #64748b;
    --primary: #0ea5e9; --primary-dark: #0284c7; --danger: #ef4444;
    --success: #22c55e; --warn: #f59e0b;
    --radius: 12px; --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-tap-highlight-color: transparent; user-select: none;
    padding-bottom: calc(64px + var(--safe-bottom));
  }
  input, textarea, select { font-size: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; padding: 8px 16px; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: .7; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warn { background: var(--warn); color: #fff; }
  .btn-ghost { background: transparent; color: var(--sub); }
  .btn-sm { min-width: 36px; min-height: 36px; padding: 4px 12px; font-size: 13px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* password gate */
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 24px; }
  .gate h1 { font-size: 28px; margin-bottom: 8px; }
  .gate p { color: var(--sub); margin-bottom: 24px; }
  .gate input { width: 100%; max-width: 280px; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; text-align: center; }

  /* timer */
  .timer-display { font-size: 56px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .timer-active { color: var(--primary); }
  .timer-idle { color: var(--sub); }
  .timer-btn {
    width: 100%; padding: 20px; border: none; border-radius: var(--radius);
    font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; transition: opacity .15s;
  }
  .timer-btn:active { opacity: .7; }
  .timer-btn-start { background: var(--primary); }
  .timer-btn-stop { background: var(--danger); }

  /* forms */
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px;
    background: #f8fafc; transition: border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }

  /* bottom nav */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid #e2e8f0;
    display: flex; justify-content: space-around; padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 44px; min-height: 44px; justify-content: center;
    background: none; border: none; color: var(--sub); font-size: 11px;
    cursor: pointer; transition: color .15s;
  }
  .nav-item.active { color: var(--primary); }
  .nav-item svg { width: 24px; height: 24px; }

  /* history */
  .date-group { margin-bottom: 8px; }
  .date-header { font-size: 13px; font-weight: 700; color: var(--sub); padding: 8px 16px 4px; }
  .timeline-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
  .timeline-time { font-size: 13px; color: var(--sub); white-space: nowrap; min-width: 90px; }
  .timeline-desc { flex: 1; font-size: 15px; }
  .timeline-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11px; background: #e0f2fe; color: var(--primary-dark); padding: 2px 8px; border-radius: 20px; }
  .timeline-actions { display: flex; gap: 4px; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--card); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 16px 32px; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 16px; }

  /* empty state */
  .empty { text-align: center; padding: 48px 24px; color: var(--sub); }
  .empty svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: .3; }

  /* toast */
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; z-index: 300; opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  /* markdown */
  .report-body h1, .report-body h2, .report-body h3 { margin: 0 0 8px; font-size: 1em; }
  .report-body p { margin-bottom: 8px; line-height: 1.6; }
  .report-body ul, .report-body ol { padding-left: 20px; margin-bottom: 8px; }
  .report-body li { margin-bottom: 4px; line-height: 1.5; }
  .report-body code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
  .section-header {
    font-size: 15px; font-weight: 700; color: var(--primary-dark);
    padding-bottom: 8px; margin-bottom: 12px; border-bottom: 2px solid #e0f2fe;
  }

  /* goals */
  .goal-item { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
  .goal-content { flex: 1; font-size: 15px; }
  .goal-inactive .goal-content { color: var(--sub); text-decoration: line-through; }

  /* feedback */
  .feedback-bar { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
  .feedback-bar .btn.active { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* spinner */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body x-data="app()" x-cloak>

<!-- Toast -->
<div class="toast" :class="{ show: toast.show }" x-text="toast.msg"></div>

<!-- Password Gate -->
<template x-if="!authed">
<div class="gate">
  <h1>LifeTrack</h1>
  <p>请输入访问密码</p>
  <input type="password" x-model="pwdInput" @keydown.enter="doAuth()" placeholder="输入密码">
  <div style="margin-top:16px">
    <button class="btn btn-primary" @click="doAuth()">进入</button>
  </div>
  <p style="margin-top:12px;font-size:13px;color:var(--danger)" x-show="authError" x-text="authError"></p>
</div>
</template>

<!-- App -->
<template x-if="authed">
<div>

  <!-- Record View -->
  <div x-show="view === 'record'">
    <div class="card" style="text-align:center">
      <div class="timer-display" :class="activeTimer ? 'timer-active' : 'timer-idle'" x-text="timerDisplay"></div>
      <template x-if="!activeTimer">
        <button class="timer-btn timer-btn-start" @click="startTimer()">开 始</button>
      </template>
      <template x-if="activeTimer">
        <button class="timer-btn timer-btn-stop" @click="stopTimer()">结 束</button>
      </template>
      <p style="font-size:13px;color:var(--sub);margin-top:8px" x-text="activeTimer ? '计时进行中...' : '点击开始记录当前活动'"></p>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">手动补录</h3>
      <div class="form-group"><label>开始时间</label><input type="datetime-local" x-model="form.start_time"></div>
      <div class="form-group"><label>结束时间</label><input type="datetime-local" x-model="form.end_time"></div>
      <div class="form-group"><label>描述</label><input type="text" x-model="form.description" placeholder="做了什么..."></div>
      <div class="form-group"><label>标签（逗号分隔）</label><input type="text" x-model="form.tags" placeholder="工作,学习,运动"></div>
      <button class="btn btn-primary" style="width:100%" @click="submitManual()">添加记录</button>
    </div>
  </div>

  <!-- History View -->
  <div x-show="view === 'history'">
    <div class="card" style="display:flex;gap:8px;align-items:center">
      <input type="date" x-model="historyDate" @change="loadHistory()" style="flex:1;padding:8px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px">
      <button class="btn btn-ghost" @click="historyDate='';loadHistory()">全部</button>
    </div>
    <template x-if="Object.keys(historyGroups).length === 0">
      <div class="empty">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p>还没有记录</p>
      </div>
    </template>
    <template x-for="(items, day) in historyGroups">
      <div class="date-group">
        <div class="date-header" x-text="day"></div>
        <template x-for="item in items">
          <div class="timeline-item">
            <div class="timeline-time">
              <div x-text="fmtTime(item.start_time)"></div>
              <div x-text="item.end_time ? '→ ' + fmtTime(item.end_time) : '进行中'"></div>
            </div>
            <div class="timeline-desc">
              <div x-text="item.description || '(无描述)'"></div>
              <div class="timeline-tags">
                <template x-for="t in (item.tags||'').split(',').filter(Boolean)">
                  <span class="tag" x-text="t.trim()"></span>
                </template>
              </div>
            </div>
            <div class="timeline-actions">
              <button class="btn btn-ghost" style="min-width:36px;min-height:36px;padding:4px" @click="editItem(item)">✏️</button>
              <button class="btn btn-ghost" style="min-width:36px;min-height:36px;padding:4px" @click="deleteItem(item.id)">🗑️</button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Report View -->
  <div x-show="view === 'report'">
    <div class="card" style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" @click="generateReport('day')" :disabled="generating">
        <span class="spinner" x-show="generating"></span>今日总结
      </button>
      <button class="btn btn-primary" style="flex:1" @click="generateReport('week')" :disabled="generating">
        <span class="spinner" x-show="generating"></span>本周分析
      </button>
    </div>

    <template x-if="latestReport">
    <div>
      <template x-for="section in reportSections">
        <div class="card report-section">
          <div class="section-header" x-text="section.title"></div>
          <div class="report-body" x-html="section.html"></div>
        </div>
      </template>

      <div class="card" x-show="latestReport.user_feedback">
        <p style="font-size:13px;color:var(--sub)">你的反馈：<strong x-text="feedbackLabel(latestReport.user_feedback)"></strong></p>
      </div>
      <div class="card" x-show="!latestReport.user_feedback">
        <p style="font-size:13px;color:var(--sub);margin-bottom:8px">这个建议对你有帮助吗？</p>
        <div class="feedback-bar">
          <button class="btn btn-sm btn-success" :class="{ active: feedbackSent === 'helpful' }" @click="sendFeedback('helpful')">有帮助</button>
          <button class="btn btn-sm btn-primary" :class="{ active: feedbackSent === 'executed' }" @click="sendFeedback('executed')">已执行</button>
          <button class="btn btn-sm btn-ghost" :class="{ active: feedbackSent === 'ignored' }" @click="sendFeedback('ignored')">忽略</button>
        </div>
      </div>
    </div>
    </template>

    <template x-if="!latestReport && !generating">
      <div class="empty">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <p>点击上方按钮生成 AI 分析报告</p>
      </div>
    </template>
  </div>

  <!-- Goals View -->
  <div x-show="view === 'goals'">
    <div class="card">
      <h3 style="margin-bottom:12px">当前目标</h3>
      <template x-if="activeGoals.length === 0">
        <p style="color:var(--sub);font-size:14px">还没有设定目标</p>
      </template>
      <template x-for="g in activeGoals">
        <div class="goal-item">
          <span class="goal-content" x-text="g.content"></span>
          <button class="btn btn-sm btn-ghost" @click="deactivateGoal(g.id)">停用</button>
        </div>
      </template>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">添加新目标</h3>
      <div style="display:flex;gap:8px">
        <input type="text" x-model="newGoal" @keydown.enter="addGoal()" placeholder="例如：每天深度工作3小时" style="flex:1;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px">
        <button class="btn btn-primary" @click="addGoal()">添加</button>
      </div>
    </div>

    <div class="card" x-show="inactiveGoals.length > 0">
      <h3 style="margin-bottom:12px;color:var(--sub)">已停用的目标</h3>
      <template x-for="g in inactiveGoals">
        <div class="goal-item goal-inactive">
          <span class="goal-content" x-text="g.content"></span>
          <button class="btn btn-sm btn-primary" @click="activateGoal(g.id)">启用</button>
        </div>
      </template>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="nav">
    <button class="nav-item" :class="{ active: view === 'record' }" @click="view='record'">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><polyline points="12,7 12,12 15,15" stroke-width="2" stroke-linecap="round"/></svg>
      记录
    </button>
    <button class="nav-item" :class="{ active: view === 'history' }" @click="view='history';loadHistory()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/></svg>
      历史
    </button>
    <button class="nav-item" :class="{ active: view === 'report' }" @click="view='report';loadReport()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      报告
    </button>
    <button class="nav-item" :class="{ active: view === 'goals' }" @click="view='goals';loadGoals()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/><line x1="12" y1="1" x2="12" y2="3" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-width="2"/></svg>
      目标
    </button>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" x-show="editModal.show" @click.self="editModal.show=false">
    <div class="modal">
      <h3>编辑记录</h3>
      <div class="form-group"><label>开始</label><input type="datetime-local" x-model="editModal.start"></div>
      <div class="form-group"><label>结束</label><input type="datetime-local" x-model="editModal.end"></div>
      <div class="form-group"><label>描述</label><input type="text" x-model="editModal.desc"></div>
      <div class="form-group"><label>标签</label><input type="text" x-model="editModal.tags"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" @click="editModal.show=false">取消</button>
        <button class="btn btn-primary" style="flex:1" @click="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- Stop Timer Modal -->
  <div class="modal-overlay" x-show="stopModal.show" @click.self="stopModal.show=false">
    <div class="modal">
      <h3>你在做什么？</h3>
      <div class="form-group"><label>描述</label><input type="text" x-model="stopModal.desc" @keydown.enter="confirmStop()" placeholder="输入活动描述..."></div>
      <div class="form-group"><label>标签（逗号分隔）</label><input type="text" x-model="stopModal.tags"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" @click="stopModal.show=false">取消</button>
        <button class="btn btn-primary" style="flex:1" @click="confirmStop()">确认结束</button>
      </div>
    </div>
  </div>

</div>
</template>

<script>
function app() {
  return {
    view: "record",
    authed: false,
    pwdInput: "",
    authError: "",
    toast: { show: false, msg: "", timer: null },
    // timer
    activeTimer: null,
    timerDisplay: "00:00:00",
    timerInterval: null,
    // forms
    form: { start_time: "", end_time: "", description: "", tags: "" },
    stopModal: { show: false, desc: "", tags: "" },
    // history
    historyDate: "",
    historyGroups: {},
    // edit
    editModal: { show: false, id: null, start: "", end: "", desc: "", tags: "" },
    // report
    latestReport: null,
    reportSections: [],
    generating: false,
    feedbackSent: null,
    // goals
    goals: [],
    newGoal: "",

    get activeGoals() { return this.goals.filter(g => g.is_active); },
    get inactiveGoals() { return this.goals.filter(g => !g.is_active); },

    async init() {
      const saved = localStorage.getItem("lifetrack_pwd");
      if (saved) { this.pwdInput = saved; await this.doAuth(); }
    },

    api(path, opts = {}) {
      const headers = {};
      if (opts.method && opts.method !== "GET") headers["Content-Type"] = "application/json";
      if (this.authed && this.pwdInput) headers["X-App-Password"] = this.pwdInput;
      return fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
    },

    showToast(msg) {
      clearTimeout(this.toast.timer);
      this.toast.msg = msg; this.toast.show = true;
      this.toast.timer = setTimeout(() => { this.toast.show = false; }, 2000);
    },

    async doAuth() {
      try {
        const res = await fetch("/api/auth/verify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: this.pwdInput }),
        });
        const data = await res.json();
        if (data.valid) {
          this.authed = true; this.authError = "";
          localStorage.setItem("lifetrack_pwd", this.pwdInput);
          await this.checkActiveTimer();
        } else { this.authError = data.detail || "密码错误"; }
      } catch { this.authError = "连接服务器失败"; }
    },

    // ── timer ──
    async checkActiveTimer() {
      try {
        const res = await this.api("/api/activities/active");
        const data = await res.json();
        if (data.active) { this.activeTimer = data.active; this.startTicking(data.active.start_time); }
      } catch (e) { console.error(e); }
    },

    startTicking(startIso) {
      const start = new Date(startIso + (startIso.endsWith("Z") ? "" : ""));
      this.timerInterval = setInterval(() => {
        const diff = Math.max(0, Date.now() - start.getTime());
        const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
        this.timerDisplay = [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
      }, 200);
    },

    async startTimer() {
      try {
        const res = await this.api("/api/activities", {
          method: "POST", body: JSON.stringify({ start_time: new Date().toISOString(), description: "" }),
        });
        const data = await res.json();
        this.activeTimer = data; this.startTicking(data.start_time); this.showToast("计时开始");
      } catch (e) { this.showToast("开始失败"); }
    },

    stopTimer() {
      this.stopModal.desc = ""; this.stopModal.tags = ""; this.stopModal.show = true;
    },

    async confirmStop() {
      if (!this.activeTimer) return;
      try {
        await this.api("/api/activities/" + this.activeTimer.id, {
          method: "PUT", body: JSON.stringify({ end_time: new Date().toISOString(), description: this.stopModal.desc, tags: this.stopModal.tags }),
        });
        clearInterval(this.timerInterval);
        this.activeTimer = null; this.timerDisplay = "00:00:00"; this.stopModal.show = false;
        this.showToast("记录已保存");
      } catch (e) { this.showToast("保存失败"); }
    },

    // ── manual entry ──
    async submitManual() {
      if (!this.form.start_time || !this.form.end_time) { this.showToast("请填写开始和结束时间"); return; }
      try {
        await this.api("/api/activities", {
          method: "POST", body: JSON.stringify({
            start_time: new Date(this.form.start_time).toISOString(), end_time: new Date(this.form.end_time).toISOString(),
            description: this.form.description, tags: this.form.tags,
          }),
        });
        this.form = { start_time: "", end_time: "", description: "", tags: "" };
        this.showToast("记录已添加");
      } catch (e) { this.showToast("添加失败"); }
    },

    // ── history ──
    async loadHistory() {
      let url = "/api/activities?limit=200";
      if (this.historyDate) url += "&date_param=" + this.historyDate;
      try {
        const res = await this.api(url);
        const data = await res.json();
        this.historyGroups = {};
        for (const item of data) {
          const day = new Date(item.start_time).toLocaleDateString("zh-CN", { weekday: "long", month: "long", day: "numeric" });
          if (!this.historyGroups[day]) this.historyGroups[day] = [];
          this.historyGroups[day].push(item);
        }
      } catch (e) { console.error(e); }
    },

    fmtTime(iso) { return new Date(iso).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }); },

    editItem(item) {
      const toLocal = (iso) => {
        const d = new Date(iso);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
      };
      this.editModal = { show: true, id: item.id, start: toLocal(item.start_time), end: item.end_time ? toLocal(item.end_time) : "", desc: item.description || "", tags: item.tags || "" };
    },

    async saveEdit() {
      try {
        await this.api("/api/activities/" + this.editModal.id, {
          method: "PUT", body: JSON.stringify({
            start_time: this.editModal.start ? new Date(this.editModal.start).toISOString() : undefined,
            end_time: this.editModal.end ? new Date(this.editModal.end).toISOString() : undefined,
            description: this.editModal.desc, tags: this.editModal.tags,
          }),
        });
        this.editModal.show = false; await this.loadHistory(); this.showToast("已更新");
      } catch (e) { this.showToast("更新失败"); }
    },

    async deleteItem(id) {
      if (!confirm("确定删除这条记录？")) return;
      try { await this.api("/api/activities/" + id, { method: "DELETE" }); await this.loadHistory(); this.showToast("已删除"); }
      catch (e) { console.error(e); }
    },

    // ── goals ──
    async loadGoals() {
      try { const res = await this.api("/api/goals"); this.goals = await res.json(); }
      catch (e) { console.error(e); }
    },

    async addGoal() {
      if (!this.newGoal.trim()) return;
      try {
        await this.api("/api/goals", { method: "POST", body: JSON.stringify({ content: this.newGoal.trim() }) });
        this.newGoal = ""; await this.loadGoals(); this.showToast("目标已添加");
      } catch (e) { this.showToast("添加失败"); }
    },

    async deactivateGoal(id) {
      try { await this.api("/api/goals/" + id + "/deactivate", { method: "PUT" }); await this.loadGoals(); this.showToast("已停用"); }
      catch (e) { this.showToast("操作失败"); }
    },

    async activateGoal(id) {
      try { await this.api("/api/goals/" + id + "/activate", { method: "PUT" }); await this.loadGoals(); this.showToast("已启用"); }
      catch (e) { this.showToast("操作失败"); }
    },

    // ── reports ──
    parseSections(md) {
      if (!md) return [];
      const sections = [];
      const parts = md.split(/(?=^# )/m);
      for (const part of parts) {
        const lines = part.trim().split("\n");
        const title = lines[0].replace(/^# /, "").trim();
        const body = lines.slice(1).join("\n").trim();
        if (title && body) {
          sections.push({
            title: title,
            html: typeof marked !== "undefined" ? marked.parse(body) : body,
          });
        }
      }
      return sections;
    },

    feedbackLabel(fb) {
      const map = { helpful: "有帮助", executed: "已执行", ignored: "忽略" };
      return map[fb] || fb;
    },

    async loadReport() {
      try {
        const res = await this.api("/api/reports/latest");
        const data = await res.json();
        this.latestReport = data.report || null;
        this.reportSections = this.latestReport ? this.parseSections(this.latestReport.summary_text) : [];
        this.feedbackSent = this.latestReport ? this.latestReport.user_feedback : null;
      } catch (e) { /* ignored */ }
    },

    async generateReport(period) {
      this.generating = true;
      try {
        const res = await this.api("/api/reports/generate", {
          method: "POST", body: JSON.stringify({ period }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "生成失败");
        }
        this.latestReport = await res.json();
        this.reportSections = this.parseSections(this.latestReport.summary_text);
        this.feedbackSent = null;
        this.showToast("报告已生成");
      } catch (e) { this.showToast(e.message || "生成失败，请检查 API Key 配置"); }
      finally { this.generating = false; }
    },

    async sendFeedback(feedback) {
      if (!this.latestReport) return;
      try {
        await this.api("/api/reports/" + this.latestReport.id + "/feedback", {
          method: "PUT", body: JSON.stringify({ feedback }),
        });
        this.latestReport.user_feedback = feedback;
        this.feedbackSent = feedback;
        this.showToast("感谢反馈");
      } catch (e) { this.showToast("反馈提交失败"); }
    },
  };
}

// pwa
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
